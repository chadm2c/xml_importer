name: docker
on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Pre-pull base images with retries
        run: |
          set -e
          imgs=("maven:3.9.9-eclipse-temurin-21" "eclipse-temurin:21-jre-jammy")
          for img in "${imgs[@]}"; do
            echo "Pulling $img"
            for i in {1..5}; do
              if docker pull "$img"; then
                echo "Pulled $img"
                break
              fi
              echo "Retry $i/5 failed for $img; sleeping..."
              sleep 15
            done
          done
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine tags
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/xml-importer-app"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:latest" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
