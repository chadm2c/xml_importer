name: ci
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: productdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/productdb -Dspring.datasource.username=postgres -Dspring.datasource.password=postgres123 -Dspring.jpa.hibernate.ddl-auto=create-drop
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml_importer-jar
          path: target/xml_importer-0.0.1-SNAPSHOT.jar
          if-no-files-found: ignore
